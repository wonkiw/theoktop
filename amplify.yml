version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - node -v
        - npm ci
        - echo "DATABASE_HOST=$DATABASE_HOST" >> .env.production
        - echo "DATABASE_NAME=$DATABASE_NAME" >> .env.production
        - echo "DATABASE_USER=$DATABASE_USER" >> .env.production
        - echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> .env.production
        - echo "DATABASE_PORT=$DATABASE_PORT" >> .env.production
        - echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> .env.production
        - echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY" >> .env.production
        - echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.production
        - echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env.production
        - echo "RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL" >> .env.production
        - echo "AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" >> .env.production
        - echo "AWS_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> .env.production
        - echo "AWS_S3_BUCKET=$S3_BUCKET" >> .env.production
        - echo "AWS_REGION=$S3_REGION" >> .env.production
        - echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL" >> .env.production
        - echo "NAVER_CLIENT_ID=$NAVER_CLIENT_ID" >> .env.production
        - echo "NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET" >> .env.production
        - echo "NAVER_REDIRECT_URI=$NAVER_REDIRECT_URI" >> .env.production
        - echo "NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=$NEXT_PUBLIC_NAVER_MAP_CLIENT_ID" >> .env.production
        - echo "NAVER_MAP_CLIENT_SECRET=$NAVER_MAP_CLIENT_SECRET" >> .env.production
        - cat .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
