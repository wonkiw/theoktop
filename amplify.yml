version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
        - mkdir -p .next/standalone/public
        - if [ -d public ]; then cp -r public/. .next/standalone/public/; fi
        - mkdir -p .next/standalone/.next/static
        - cp -r .next/static/. .next/standalone/.next/static/
  artifacts:
    baseDirectory: .next/standalone
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
